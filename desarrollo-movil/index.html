<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reloj PWA</title>

  <meta name="theme-color" content="#10141A" />
  <meta name="description" content="PWA que muestra la hora actual del sistema, actualizada cada segundo." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="app">
    <div id="connection-status" class="status-badge" aria-live="polite">
      <span id="connection-dot" class="status-dot"></span>
      <span id="connection-text">Conectado</span>
    </div>

    <p id="current-date" class="date"></p>

    <section class="clock" aria-label="Hora actual">
      <span id="hours" class="time-part">00</span>
      <span class="colon">:</span>
      <span id="minutes" class="time-part">00</span>
      <span class="colon">:</span>
      <span id="seconds" class="time-part">00</span>
    </section>

    <p class="hint">La hora se actualiza automáticamente cada segundo.</p>

    <button id="install-button" class="install-button" hidden>
      Instalar aplicación
    </button>
  </main>

  <script src="app.js"></script>
</body>
</html>
